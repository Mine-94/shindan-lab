name: Apply Japanese quality update 2026-09-01

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-2026-09-01-quality.yml

permissions:
  contents: write

jobs:
  apply-quality-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Correct matcher for both malformed main variants
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply-2026-09-01-quality.js')
          source = path.read_text(encoding='utf-8')
          old = r"""  const malformedMatches = source.match(/\n\s*main>`;/g) || [];
            if (malformedMatches.length !== 2) {
              throw new Error(`Expected exactly 2 malformed main closings, found ${malformedMatches.length}`);
            }
            source = source.replace(/\n\s*main>`;/g, '\n  </main>`;');"""
          new = r"""  const malformedMatches = source.match(/\n\s*main>/g) || [];
            if (malformedMatches.length !== 2) {
              throw new Error(`Expected exactly 2 malformed main closings, found ${malformedMatches.length}`);
            }
            source = source.replace(/\n\s*main>/g, '\n  </main>');"""
          if old not in source:
              raise SystemExit('Expected matcher block was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply quality patch
        run: node scripts/apply-2026-09-01-quality.js

      - name: Validate JavaScript syntax
        run: |
          node --check views/render.js
          node --check data/quizzes.js
          node --check data/quiz-editorial.js
          node --check server.js

      - name: Run existing and new tests
        run: bash run_tests.sh

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/render.js data/quizzes.js server.js run_tests.sh public/css/style.css README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Improve Japanese diagnosis content quality and fix HTML"
          git push origin main
