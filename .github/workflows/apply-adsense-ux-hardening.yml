name: Apply AdSense UX hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-adsense-ux-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shindan-lab-adsense-ux-hardening
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply assertion-based UX and inventory migration
        run: python3 scripts/apply_adsense_ux_hardening.py

      - name: Validate source syntax
        run: |
          python3 -m py_compile scripts/apply_adsense_ux_hardening.py
          node --check server.js
          node --check views/render.js
          node --check scripts/test-adsense-ux.js

      - name: Validate AdSense page eligibility and navigation
        run: node scripts/test-adsense-ux.js

      - name: Run full shell regression suite
        run: bash run_tests.sh

      - name: Run all packaged tests and content audit
        run: npm test

      - name: Commit only fully tested production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server.js \
            views/render.js \
            public/about.html \
            public/editorial-policy.html \
            public/contact.html \
            public/privacy.html \
            public/terms.html \
            public/404.html \
            public/css/style.css \
            public/manifest.json \
            docs/adsense-approval-readiness-2026-09-02.md \
            package.json
          if git diff --cached --quiet; then
            echo "AdSense UX hardening is already current."
            exit 0
          fi
          git commit -m "Improve AdSense navigation, privacy and inventory controls"
          git push origin main
