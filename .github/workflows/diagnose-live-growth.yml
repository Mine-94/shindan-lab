name: Verify live AdSense UX readiness

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-live-growth.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://shindan24.com
      ADSENSE_CLIENT: ca-pub-8602848692420724
    steps:
      - name: Wait until the complete 2026-09-03 release is live
        run: |
          set -u
          ready=0
          for attempt in $(seq 1 36); do
            curl -fsS --max-time 60 "$SITE_URL/" -o /tmp/home.html || true
            curl -fsS --max-time 60 "$SITE_URL/contact.html" -o /tmp/contact.html || true
            curl -fsS --max-time 60 "$SITE_URL/sitemap.xml" -o /tmp/sitemap.xml || true

            if grep -q 'aria-label="主要メニュー"' /tmp/home.html 2>/dev/null \
              && grep -q 'class="content-review container"' /tmp/home.html 2>/dev/null \
              && grep -q '最終確認：2026年9月3日' /tmp/home.html 2>/dev/null \
              && grep -q 'issues/new?template=site-contact.yml' /tmp/contact.html 2>/dev/null \
              && grep -q '送信内容は公開されます' /tmp/contact.html 2>/dev/null \
              && ! grep -q 'mailto:' /tmp/contact.html 2>/dev/null \
              && [ "$(grep -o '<lastmod>2026-09-03</lastmod>' /tmp/sitemap.xml 2>/dev/null | wc -l | tr -d ' ')" = '60' ]; then
              ready=1
              break
            fi
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo 'The complete AdSense UX and contact release was not visible on shindan24.com.'
            exit 1
          fi
          echo 'The complete AdSense UX and contact release is visible.'

      - name: Verify public content, private results and technical readiness
        run: |
          set -euo pipefail

          curl -fsS --max-time 60 -D /tmp/home.headers "$SITE_URL/" -o /tmp/home.html
          curl -fsS --max-time 60 -D /tmp/quiz.headers "$SITE_URL/q/honto-no-seikaku" -o /tmp/quiz.html
          curl -fsS --max-time 60 -D /tmp/compat-landing.headers "$SITE_URL/16type/compatibility" -o /tmp/compat-landing.html
          curl -fsS --max-time 60 -D /tmp/contact.headers "$SITE_URL/contact.html" -o /tmp/contact.html
          curl -fsS --max-time 60 -D /tmp/privacy.headers "$SITE_URL/privacy.html" -o /tmp/privacy.html
          curl -fsS --max-time 60 -D /tmp/css.headers "$SITE_URL/css/style.css" -o /tmp/style.css
          curl -fsS --max-time 60 "$SITE_URL/sitemap.xml" -o /tmp/sitemap.xml
          curl -fsS --max-time 60 "$SITE_URL/ads.txt" -o /tmp/ads.txt

          curl -fsS --max-time 60 -D /tmp/scored.headers \
            "$SITE_URL/q/oshikatsu-type/r/kamiseki?s=75" -o /tmp/scored.html
          curl -fsS --max-time 60 -D /tmp/invite.headers \
            "$SITE_URL/16type/test?compare=ENFP&relation=friend&utm_source=invite" -o /tmp/invite.html
          curl -fsS --max-time 60 -D /tmp/type-result.headers \
            "$SITE_URL/16type/r/ENFP?e=80&s=20&t=20&j=20" -o /tmp/type-result.html
          curl -fsS --max-time 60 -D /tmp/compat-result.headers \
            "$SITE_URL/16type/compatibility?self=ENFP&partner=ISTJ&relation=friend" -o /tmp/compat-result.html
          curl -fsS --max-time 60 -D /tmp/name.headers \
            "$SITE_URL/meimei/r/%E4%BD%90%E8%97%A4/%E6%B9%8A" -o /tmp/name.html

          missing_status=$(curl -sS --max-time 60 -D /tmp/missing.headers \
            -o /tmp/missing.html -w '%{http_code}' "$SITE_URL/adsense-ux-missing-page")
          www_status=$(curl -sS --max-time 60 -D /tmp/www.headers \
            -o /dev/null -w '%{http_code}' 'https://www.shindan24.com/16type?from=www-test')

          python3 - <<'PY'
          from pathlib import Path

          ad_url = 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js'
          publisher = 'ca-pub-8602848692420724'
          unverified_alias = 'contact@' + 'shindan24.com'

          def text(path):
              return Path(path).read_text(encoding='utf-8', errors='replace')

          def headers(path):
              return text(path).lower()

          for label, body_path, header_path in (
              ('home', '/tmp/home.html', '/tmp/home.headers'),
              ('quiz landing', '/tmp/quiz.html', '/tmp/quiz.headers'),
              ('compatibility landing', '/tmp/compat-landing.html', '/tmp/compat-landing.headers'),
          ):
              body = text(body_path)
              hdr = headers(header_path)
              assert body.count(ad_url) == 1, f'{label}: AdSense loader count is {body.count(ad_url)}'
              assert publisher in body, f'{label}: publisher ID missing'
              assert 'aria-label="主要メニュー"' in body, f'{label}: global navigation missing'
              assert 'href="/contact.html"' in body, f'{label}: contact link missing'
              assert 'fonts.googleapis.com' not in body, f'{label}: remote Google Fonts remain'
              assert 'referrer-policy: strict-origin-when-cross-origin' in hdr, f'{label}: referrer header missing'
              assert 'content-language: ja' in hdr, f'{label}: language header missing'

          for label, body_path, header_path in (
              ('scored quiz result', '/tmp/scored.html', '/tmp/scored.headers'),
              ('invitation test', '/tmp/invite.html', '/tmp/invite.headers'),
              ('personalized type result', '/tmp/type-result.html', '/tmp/type-result.headers'),
              ('selected compatibility result', '/tmp/compat-result.html', '/tmp/compat-result.headers'),
              ('name result', '/tmp/name.html', '/tmp/name.headers'),
          ):
              body = text(body_path)
              hdr = headers(header_path)
              assert ad_url not in body, f'{label}: AdSense loader must be removed'
              assert 'x-robots-tag: noindex, follow' in hdr, f'{label}: noindex header missing'
              assert 'cache-control: private, no-store' in hdr, f'{label}: private no-store missing'

          contact = text('/tmp/contact.html')
          contact_headers = headers('/tmp/contact.headers')
          assert 'issues/new?template=site-contact.yml' in contact
          assert '送信内容は公開されます' in contact
          assert 'mailto:' not in contact
          assert unverified_alias not in contact
          assert ad_url not in contact
          assert 'aria-label="主要メニュー"' in contact
          assert 'referrer-policy: strict-origin-when-cross-origin' in contact_headers

          privacy = text('/tmp/privacy.html')
          privacy_headers = headers('/tmp/privacy.headers')
          assert ad_url not in privacy, 'privacy page contains an ad tag'
          assert 'fonts.googleapis.com' not in privacy, 'privacy page loads Google Fonts'
          assert 'name="referrer" content="strict-origin-when-cross-origin"' in privacy
          assert 'aria-label="主要メニュー"' in privacy
          assert 'referrer-policy: strict-origin-when-cross-origin' in privacy_headers

          css_headers = headers('/tmp/css.headers')
          assert 'cache-control: public, max-age=3600' in css_headers, css_headers

          sitemap = text('/tmp/sitemap.xml')
          assert sitemap.count('<url>') == 60
          assert sitemap.count('<lastmod>2026-09-03</lastmod>') == 60
          assert '/meimei/r/' not in sitemap
          assert 'shindan-lab.onrender.com' not in sitemap

          ads = text('/tmp/ads.txt').strip()
          assert ads == 'google.com, pub-8602848692420724, DIRECT, f08c47fec0942fa0'

          home = text('/tmp/home.html')
          assert 'class="content-review container"' in home
          assert '最終確認：2026年9月3日' in home

          print('LIVE PASS: AdSense eligibility, truthful contact, privacy, navigation, caching, noindex inventory and sitemap metadata verified.')
          PY

          [ "$missing_status" = '404' ]
          grep -qi '^x-robots-tag:.*noindex' /tmp/missing.headers
          grep -q 'ページが見つかりません' /tmp/missing.html

          [ "$www_status" = '301' ]
          grep -qi '^location: https://shindan24.com/16type?from=www-test' /tmp/www.headers

          echo 'LIVE PASS: the 2026-09-03 AdSense approval-readiness release is fully deployed.'
