name: Diagnose live AdSense readiness

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-live-growth.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://shindan24.com
    steps:
      - name: Inspect current live AdSense revision without masking the result
        run: |
          set -u
          paths=(
            "/"
            "/about.html"
            "/contact.html"
            "/privacy.html"
            "/sitemap.xml"
            "/meimei/r/%E4%BD%90%E8%97%A4/%E6%B9%8A"
            "/adsense-readiness-missing-page"
          )

          for request_path in "${paths[@]}"; do
            safe=$(printf '%s' "$request_path" | tr '/?%&=' '______')
            echo "===== $request_path ====="
            status=$(curl -sS --max-time 60 -D "/tmp/${safe}.headers" -o "/tmp/${safe}.body" -w '%{http_code}' "$SITE_URL$request_path" || true)
            echo "HTTP $status"
            grep -Ei '^(location|x-robots-tag|content-type):' "/tmp/${safe}.headers" || true
            echo "bytes=$(wc -c < "/tmp/${safe}.body" 2>/dev/null || echo 0)"

            case "$request_path" in
              /)
                grep -Eo '運営・編集：しんだんラボ編集部|href="/contact.html"' "/tmp/${safe}.body" | head -n 10 || true
                ;;
              /about.html)
                grep -Eo '運営者情報|しんだんラボ編集部|shindan-lab.onrender.com' "/tmp/${safe}.body" | head -n 10 || true
                ;;
              /contact.html)
                grep -Eo 'contact@shindan24.com|site-contact.yml|お問い合わせ' "/tmp/${safe}.body" | head -n 20 || true
                ;;
              /privacy.html)
                grep -Eo '第三者配信事業者|ウェブビーコン|Google広告設定' "/tmp/${safe}.body" | head -n 10 || true
                ;;
              /sitemap.xml)
                echo "url_count=$(grep -o '<url>' "/tmp/${safe}.body" | wc -l | tr -d ' ')"
                grep -Eo '/contact.html</loc>|/meimei/r/' "/tmp/${safe}.body" | head -n 10 || true
                ;;
              /adsense-readiness-missing-page)
                grep -Eo 'ページが見つかりません' "/tmp/${safe}.body" | head -n 5 || true
                ;;
            esac
          done

          echo "===== shindan24.com MX ====="
          curl -fsS --max-time 30 'https://dns.google/resolve?name=shindan24.com&type=MX' -o /tmp/mx.json || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          try:
              data = json.loads(Path('/tmp/mx.json').read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'MX lookup unavailable: {exc}')
          else:
              answers = [item.get('data', '') for item in data.get('Answer', [])]
              print(f'DNS status={data.get("Status")}; MX answers={answers}')
              if not answers:
                  print('WARNING: no MX record is published; contact@shindan24.com should not be presented as a working mailbox yet.')
          PY

          echo "Diagnostic completed. Review the markers above; this job intentionally does not convert a stale deployment or missing MX into a code failure."
