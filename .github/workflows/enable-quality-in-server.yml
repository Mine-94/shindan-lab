name: Enable validated quality renderer in Render entry

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-quality-in-server.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply assertion-based server migration
        run: python3 scripts/enable_quality_in_server.py

      - name: Validate syntax
        run: |
          node --check server.js
          node --check views/quality-render.js
          node --check data/quiz-editorial.js
          node --check scripts/test-quality.js

      - name: Run the existing regression suite
        run: bash run_tests.sh

      - name: Run all new content-quality integration checks
        run: node scripts/test-quality.js

      - name: Commit only the tested production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js scripts/test-quality.js run_tests.sh package.json
          if git diff --cached --quiet; then
            echo "No production changes were needed."
            exit 0
          fi
          git commit -m "Enable Japanese content quality layer in production server"
          git push origin main
