name: Enable search engine ownership metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-search-verification-meta.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shindan24-search-verification-meta
  cancel-in-progress: false

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply ownership metadata support
        run: python3 scripts/apply_search_verification_meta.py

      - name: Validate syntax
        run: |
          python3 -m py_compile scripts/apply_search_verification_meta.py
          node --check views/render.js
          node --check scripts/test-search-verification.js

      - name: Validate Google, Naver and Bing metadata
        run: node scripts/test-search-verification.js

      - name: Run all packaged tests and content audit
        run: npm test

      - name: Commit only the tested metadata support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/render.js package.json README.md
          if git diff --cached --quiet; then
            echo 'Search verification metadata support is already current.'
            exit 0
          fi
          git commit -m "Support Google, Naver and Bing site verification metadata"
          git push origin main
