name: Enable unified same-type celebrity lists

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-type16-celebrities.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shindan-lab-type16-celebrities
  cancel-in-progress: false

jobs:
  integrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Enable the celebrity renderer
        run: python3 scripts/enable_type16_celebrities.py

      - name: Validate source syntax
        run: |
          python3 -m py_compile scripts/enable_type16_celebrities.py
          node --check data/type16-celebrities.js
          node --check views/type16-celebrity-render.js
          node --check public/js/type16-celebrities.js
          node --check scripts/test-type16-celebrities.js
          node --check server.js

      - name: Validate all 16 unified lists
        run: node scripts/test-type16-celebrities.js

      - name: Run full shell regression suite
        run: bash run_tests.sh

      - name: Run all packaged tests and content audit
        run: npm test

      - name: Commit only fully tested production integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js package.json
          if git diff --cached --quiet; then
            echo 'Same-type celebrity integration is already current.'
            exit 0
          fi
          git commit -m "Show sourced same-type celebrities on 16-type results"
          git push origin main
