name: Enable Japanese 16-type share cards

# Revision 2: the legacy 16-type homepage fixture now matches the live homepage structure.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-type16-share-card.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Enable share-card renderer in production
        run: python3 scripts/enable_type16_share.py

      - name: Validate source syntax
        run: |
          python3 -m py_compile scripts/enable_type16_share.py
          node --check views/type16-share-render.js
          node --check public/js/type16-share-card.js
          node --check scripts/test-type16-share.js
          node --check scripts/test-type16.js
          node --check server.js

      - name: Validate share-card payloads and browser fallbacks
        run: node scripts/test-type16-share.js

      - name: Run existing regression suite
        run: bash run_tests.sh

      - name: Run full integration suite
        run: node scripts/test-quality.js

      - name: Run the packaged test command
        run: npm test

      - name: Commit only tested application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js package.json docs/japan-seo-daily-log.md
          if git diff --cached --quiet; then
            echo "No production application changes were needed."
            exit 0
          fi
          git commit -m "Add shareable images to Japanese 16-type results"
          git push origin main
