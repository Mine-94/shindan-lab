name: Enable Japanese 16-type diagnosis and compatibility

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-type16.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Apply assertion-based production migration
        run: python3 scripts/enable_type16_v2.py

      - name: Validate source syntax
        run: |
          python3 -m py_compile scripts/enable_type16.py scripts/enable_type16_v2.py
          node --check data/type16.js
          node --check views/type16-render.js
          node --check public/js/type16-test.js
          node --check scripts/test-type16.js
          node --check scripts/test-quality.js
          node --check views/render.js
          node --check server.js

      - name: Validate all type data and 1,024 relationship contexts
        run: node scripts/test-type16.js

      - name: Run existing regression suite
        run: bash run_tests.sh

      - name: Run full integration suite
        run: node scripts/test-quality.js

      - name: Commit only the tested production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js views/render.js run_tests.sh scripts/test-quality.js package.json README.md docs/japan-seo-daily-log.md .github/workflows/indexnow.yml .github/workflows/verify-live-quality.yml
          if git diff --cached --quiet; then
            echo "No production changes were needed."
            exit 0
          fi
          git commit -m "Add Japanese 16-type test, compatibility and type guides"
          git push origin main
