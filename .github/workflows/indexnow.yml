name: Submit updated Japanese pages to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - views/**
      - data/**
      - public/**
      - server*.js
      - package*.json
      - .github/workflows/indexnow.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shindan-lab-indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for the verified 107-page Render deployment
        env:
          SITE_URL: https://shindan-lab.onrender.com
          INDEXNOW_KEY: c43e252ab66ef069ad3bbb37b081739d
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            key_ok=0
            sitemap_ok=0

            if curl -fsS --max-time 30 "$SITE_URL/$INDEXNOW_KEY.txt" | grep -qx "$INDEXNOW_KEY"; then
              key_ok=1
            fi

            if curl -fsS --max-time 45 "$SITE_URL/sitemap.xml" -o /tmp/sitemap.xml; then
              url_count=$(grep -o '<url>' /tmp/sitemap.xml | wc -l | tr -d ' ')
              if [ "$url_count" = '107' ] \
                && grep -q '/about.html</loc>' /tmp/sitemap.xml \
                && grep -q '/editorial-policy.html</loc>' /tmp/sitemap.xml \
                && grep -q '/16type/test</loc>' /tmp/sitemap.xml \
                && grep -q '/16type/r/ENFP</loc>' /tmp/sitemap.xml; then
                sitemap_ok=1
              fi
            fi

            if [ "$key_ok" -eq 1 ] && [ "$sitemap_ok" -eq 1 ]; then
              ready=1
              break
            fi
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo "The verified 107-page deployment or IndexNow key could not be confirmed."
            exit 1
          fi
          echo "Verified the deployed IndexNow key and all 107 sitemap URLs."

      - name: Build URL list from the deployed sitemap
        env:
          SITE_URL: https://shindan-lab.onrender.com
          INDEXNOW_KEY: c43e252ab66ef069ad3bbb37b081739d
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          site_url = os.environ['SITE_URL']
          key = os.environ['INDEXNOW_KEY']
          root = ET.parse('/tmp/sitemap.xml').getroot()
          urls = []
          for element in root.iter():
              if element.tag.endswith('loc') and element.text:
                  value = element.text.strip()
                  if value.startswith(site_url):
                      urls.append(value)

          urls = list(dict.fromkeys(urls))
          if len(urls) != 107:
              raise SystemExit(f'Expected 107 verified URLs, found {len(urls)}.')

          payload = {
              'host': 'shindan-lab.onrender.com',
              'key': key,
              'keyLocation': f'{site_url}/{key}.txt',
              'urlList': urls,
          }
          with open('/tmp/indexnow.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False)
          print(f'Prepared {len(urls)} URLs for IndexNow.')
          PY

      - name: Submit URLs to IndexNow
        run: |
          status=$(curl -sS --max-time 60 \
            -o /tmp/indexnow-response.txt \
            -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow)
          cat /tmp/indexnow-response.txt || true
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "IndexNow returned HTTP $status"
            exit 1
          fi
          echo "IndexNow accepted the 107-URL submission with HTTP $status."
