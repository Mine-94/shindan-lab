name: Submit updated Japanese pages to IndexNow

on:
  push:
    branches:
      - main
    paths:
      - views/**
      - data/**
      - public/**
      - server*.js
      - package*.json
      - .github/workflows/indexnow.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shindan-lab-indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait until the latest Render deployment is reachable
        env:
          SITE_URL: https://shindan-lab.onrender.com
          INDEXNOW_KEY: c43e252ab66ef069ad3bbb37b081739d
        run: |
          ready=0
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 30 "$SITE_URL/$INDEXNOW_KEY.txt" | grep -qx "$INDEXNOW_KEY"; then
              ready=1
              break
            fi
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "The deployed IndexNow key could not be verified."
            exit 1
          fi

      - name: Build URL list from the deployed sitemap
        env:
          SITE_URL: https://shindan-lab.onrender.com
          INDEXNOW_KEY: c43e252ab66ef069ad3bbb37b081739d
        run: |
          curl -fsS --retry 5 --retry-delay 5 --max-time 60 "$SITE_URL/sitemap.xml" -o /tmp/sitemap.xml
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          site_url = os.environ['SITE_URL']
          key = os.environ['INDEXNOW_KEY']
          root = ET.parse('/tmp/sitemap.xml').getroot()
          urls = []
          for element in root.iter():
              if element.tag.endswith('loc') and element.text:
                  value = element.text.strip()
                  if value.startswith(site_url):
                      urls.append(value)

          urls = list(dict.fromkeys(urls))
          if not urls:
              raise SystemExit('No same-site URLs were found in the deployed sitemap.')
          if len(urls) > 10000:
              raise SystemExit(f'Too many URLs for one IndexNow request: {len(urls)}')

          payload = {
              'host': 'shindan-lab.onrender.com',
              'key': key,
              'keyLocation': f'{site_url}/{key}.txt',
              'urlList': urls,
          }
          with open('/tmp/indexnow.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, ensure_ascii=False)
          print(f'Prepared {len(urls)} URLs for IndexNow.')
          PY

      - name: Submit URLs to IndexNow
        run: |
          status=$(curl -sS --max-time 60 \
            -o /tmp/indexnow-response.txt \
            -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow)
          cat /tmp/indexnow-response.txt || true
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "IndexNow returned HTTP $status"
            exit 1
          fi
          echo "IndexNow accepted the submission with HTTP $status."
