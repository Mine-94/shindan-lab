name: Trigger latest Render deploy safely

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-render-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger latest available commit without exposing credentials
        run: |
          set -euo pipefail
          hook="${RENDER_DEPLOY_HOOK_URL:-${RENDER_DEPLOY_HOOK:-}}"

          if [ -n "$hook" ]; then
            status=$(curl -sS --max-time 60 \
              -o /tmp/render-response.json \
              -w '%{http_code}' \
              -X POST "$hook")
            echo "Render deploy hook returned HTTP $status."
            if [ "$status" != '200' ] && [ "$status" != '202' ]; then
              echo 'The configured Render deploy hook did not accept the request.'
              exit 1
            fi
            exit 0
          fi

          if [ -n "${RENDER_API_KEY:-}" ] && [ -n "${RENDER_SERVICE_ID:-}" ]; then
            status=$(curl -sS --max-time 60 \
              -o /tmp/render-response.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Content-Type: application/json' \
              --data '{"clearCache":"do_not_clear"}' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            echo "Render API returned HTTP $status."
            if [ "$status" != '200' ] && [ "$status" != '201' ] && [ "$status" != '202' ]; then
              echo 'The configured Render API credentials did not accept the request.'
              exit 1
            fi
            exit 0
          fi

          echo 'No supported Render deploy secret is configured in this GitHub repository.'
          echo 'Expected RENDER_DEPLOY_HOOK_URL (preferred), RENDER_DEPLOY_HOOK, or both RENDER_API_KEY and RENDER_SERVICE_ID.'
          exit 2
