name: Trigger Render growth deployment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-render-growth-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_A: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      DEPLOY_HOOK_B: ${{ secrets.RENDER_DEPLOY_HOOK }}
      DEPLOY_HOOK_C: ${{ secrets.DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger a configured Render deploy without exposing credentials
        run: |
          hook=''
          for candidate in "$DEPLOY_HOOK_A" "$DEPLOY_HOOK_B" "$DEPLOY_HOOK_C"; do
            if [ -n "$candidate" ]; then
              hook="$candidate"
              break
            fi
          done

          if [ -n "$hook" ]; then
            status=$(curl -sS --max-time 60 -o /tmp/render-hook-response.txt -w '%{http_code}' -X POST "$hook")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "A configured Render deploy hook returned HTTP $status."
              exit 1
            fi
            echo "Triggered Render through a configured deploy hook (HTTP $status)."
            exit 0
          fi

          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            status=$(curl -sS --max-time 60 \
              -o /tmp/render-api-response.txt \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Content-Type: application/json' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Configured Render API credentials returned HTTP $status."
              exit 1
            fi
            echo "Triggered Render through configured API credentials (HTTP $status)."
            exit 0
          fi

          echo "No Render deploy hook or API credentials are configured in GitHub Actions secrets."
          echo "The application code is tested and committed, but Render must have Auto-Deploy enabled or be deployed manually."
